name: Build Linux AppImage

# Builds a portable KeeperFX AppImage (bundles the engine, SDL3, all libraries
# and the free KeeperFX data) and - when triggered by an 'appimage-*' tag -
# publishes it as a GitHub Release asset.
#
# The build runs inside an Ubuntu 24.04 container (glibc 2.39 + ffmpeg 6.1), the
# toolchain upstream's Linux CI uses, while checkout / upload happen on the host
# runner (which has git and Node for the JS actions).

on:
  workflow_dispatch:        # manual run from the Actions tab (uploads an artifact)
  push:
    tags:
      - 'appimage-*'        # tag push also publishes a Release

permissions:
  contents: write           # allow the release step to create a release & upload assets

jobs:
  appimage:
    name: Build portable AppImage (Ubuntu 24.04)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build AppImage in an Ubuntu 24.04 container
        run: |
          set -eux
          mkdir -p dist/out
          docker run --rm -v "$PWD":/src -w /src ubuntu:24.04 \
            bash dist/linux/build-appimage.sh /src/dist/out
          sudo chown -R "$(id -u):$(id -g)" dist/out || true
          ls -la dist/out

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: keeperfx-linux-appimage
          path: dist/out/*.AppImage
          if-no-files-found: error

      - name: Publish Release (on appimage-* tag)
        if: startsWith(github.ref, 'refs/tags/appimage-')
        uses: softprops/action-gh-release@v2
        with:
          name: "KeeperFX Linux AppImage - ${{ github.ref_name }}"
          files: dist/out/*.AppImage
          generate_release_notes: false
          body: |
            Portable KeeperFX AppImage for **x86_64 Linux** (Ubuntu, Fedora, Linux Mint,
            Debian, Arch, …). All libraries are bundled, so no dependencies need to be installed.

            **You must own the original Dungeon Keeper** (GOG / Steam / CD); its files are not
            bundled for copyright reasons. See the
            [Linux section of the README](https://github.com/DoubyCz/keeperfx#linux) for how to
            download, run, and supply the original game data.
